<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主页配色方案</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f5f5f4;--surface-2:#fff;--border:rgba(0,0,0,.1);--text-primary:#1a1a19;--text-secondary:#5f5e5a;--text-muted:#888780}
@media (prefers-color-scheme:dark){:root{--surface-0:#161615;--surface-2:#2c2c2a;--border:rgba(255,255,255,.1);--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780}}
body{margin:0;padding:24px 16px;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:820px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
h2{font-size:15px;font-weight:600;margin:0}
.meta{font-size:13px;color:var(--text-secondary);margin:0 0 20px;line-height:1.6}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--text-muted)}
.desc{font-size:13px;color:var(--text-secondary);margin:0 0 6px;line-height:1.6}
.impl{font-size:12px;color:var(--text-muted);margin:0 0 14px;line-height:1.6}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.pair{display:flex;gap:16px;flex-wrap:wrap}

/* Phone at 1px = 1pt, a 375pt screen. */
.phone{--bg:#fff;--fg:#000;--fg2:rgba(60,60,67,.6);--fill:rgba(120,120,128,.12);--glass:rgba(255,255,255,.75);--glassBorder:rgba(0,0,0,.08);
  --seal1:#e04b40;--seal2:#a3221d;--ink:#f7e9c8;--sealText:#c8372d;--mono1:#a5a8b0;--mono2:#7d8089;
  flex:0 0 375px;background:var(--bg);color:var(--fg);border-radius:28px;padding:14px 0 18px;box-sizing:border-box;overflow:hidden;
  border:0.5px solid var(--border)}
.phone.dark{--bg:#000;--fg:#fff;--fg2:rgba(235,235,245,.6);--fill:rgba(120,120,128,.24);--glass:rgba(40,40,42,.75);--glassBorder:rgba(255,255,255,.1);
  --seal1:#e5544a;--sealText:#ec6a60;--mono1:#6c6e75;--mono2:#4a4c52}
.pad{padding:0 16px}
.nav{display:flex;justify-content:flex-end;gap:8px;padding:0 16px}
.nav span{width:34px;height:34px;border-radius:50%;background:var(--glass);border:0.5px solid var(--glassBorder);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.nav .dot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;background:var(--badge,#ff3b30)}
.title{font-size:32px;font-weight:700;padding:4px 16px 10px;letter-spacing:.2px}
.stack>*+*{margin-top:24px}
.sec{font-size:20px;font-weight:700;padding:0 16px 10px;display:flex;align-items:center;gap:4px}
.sec i{font-size:15px;color:var(--fg2)}
.cover{border-radius:8px;position:relative;overflow:hidden}
.c1{background:linear-gradient(150deg,#f3c6c9,#b7697d 55%,#5e3a5c)}
.c2{background:linear-gradient(150deg,#cfe3f1,#7ea2c9 55%,#3f4d78)}
.c3{background:linear-gradient(150deg,#f6e2c0,#d8a26c 55%,#7c4f3a)}
.c4{background:linear-gradient(150deg,#d9eadb,#86b392 55%,#3d5e4f)}
.c5{background:linear-gradient(150deg,#e6d6f2,#a58bc9 55%,#4f3d72)}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.35),transparent 45%)}

.hero{position:relative;margin:0 16px;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.hero .cover{position:absolute;inset:0;border-radius:0}
.hero .shade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.hero .txt{position:absolute;left:14px;right:110px;bottom:14px;color:#fff}
.hero .txt small{display:block;font-size:12px;opacity:.8}
.hero .txt b{display:block;font-size:17px;font-weight:600;line-height:1.25;margin:1px 0}
.hero .txt em{font-style:normal;font-size:12px;opacity:.85}
.play{position:absolute;right:14px;bottom:14px;background:#fff;color:#000;border-radius:99px;font-size:15px;font-weight:600;padding:7px 14px;display:flex;align-items:center;gap:4px}
.play.seal{background:linear-gradient(160deg,var(--seal1),var(--seal2));color:var(--ink)}

.chips{display:flex;gap:8px;padding:0 16px}
.chip{font-size:15px;padding:8px 12px;border-radius:99px;background:var(--fill);white-space:nowrap;display:flex;align-items:center;gap:4px}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.on.seal{background:linear-gradient(160deg,var(--seal1),var(--seal2));color:var(--ink)}
.picks{display:flex;gap:12px;padding:0 16px}
.picks div{flex:1;height:44px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600}
.picks i{font-size:17px}
.picks.seal i{color:var(--sealText)}

.shelf{display:flex;gap:12px;padding:0 16px;overflow:hidden}
.tile{flex:none;width:150px}
.tile .cover{aspect-ratio:4/3;margin-bottom:6px}
.tile p{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile p+p{color:var(--fg2)}

.vas{display:flex;gap:16px;padding:0 16px;overflow:hidden}
.va{flex:none;width:72px;text-align:center;font-size:12px}
.mono{width:64px;height:64px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff}
.m-rain{border-radius:50%}
.m-gray{border-radius:50%;background:linear-gradient(var(--mono1),var(--mono2))}
.m-seal{border-radius:14px;background:linear-gradient(160deg,var(--seal1),var(--seal2));color:var(--ink);font-family:"Songti SC","STSong","Hiragino Mincho ProN",serif;font-weight:900;font-size:30px;position:relative}
.m-seal::after{content:"";position:absolute;inset:6px;border:1.5px solid rgba(247,233,200,.5);border-radius:8px}

/* C: listening panel under the cover */
.now{margin:0 16px;border-radius:18px;overflow:hidden;background:var(--fill)}
.now .top{display:flex;gap:12px;padding:12px}
.now .cover{width:96px;height:72px;flex:none}
.now .meta2{flex:1;min-width:0}
.now .meta2 small{font-size:12px;color:var(--fg2)}
.now .meta2 b{display:block;font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{height:4px;border-radius:2px;background:var(--fill);margin:0 12px;overflow:hidden}
.prog div{height:100%;width:62%;background:var(--sealText)}
.now .ctl{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 12px}
.now .ctl .t{font-size:12px;color:var(--fg2)}
.now .ctl .play{position:static}
.now .sl{display:flex;gap:6px;padding:0 12px 12px;border-top:0.5px solid var(--glassBorder);padding-top:10px;align-items:center}
.now .sl>i{font-size:16px;color:var(--fg2);margin-right:2px}
.now .sl .chip{font-size:13px;padding:6px 10px}
</style>
</head>
<body><main>
<h1>主页配色方案</h1>
<p class="meta">2026-10-14 选定 B，但「常听声优」保持彩色轮换，不改印章。另外采用本页封面占位的五种渐变，替换全 App 无封面时的灰底图标（按 RJ 号 / 视频 ID 固定取色）。<br>现状：主页大体已经是单色（灰底胶囊、白色播放钮），跳色的只有「常听声优」——八种彩色圆形轮换；同时整页没有一处印章朱红，和设置页新的印章头卡接不上。下面三个方案由小到大，每个左浅色右深色。封面是占位色块。</p>
<div id="schemes"></div>
</main>
<script>
const shelf = (title, items, arrow = true) => `
  <div><div class="sec">${title}${arrow ? `<i class="ti ti-chevron-right"></i>` : ""}</div>
  <div class="shelf">${items.map(([c, t, s]) => `<div class="tile"><div class="cover ${c}"></div><p>${t}</p><p>${s}</p></div>`).join("")}</div></div>`;

const recent = shelf("最近播放", [["c2","【耳かき】雨音の夜、となりで","12 分钟前"],["c3","おやすみ前の囁き添い寝","昨天"],["c4","癒やしの森のカフェ","3 天前"]]);
const names = ["柚木つばめ","沢野ぽぷら","秋野かえで","涼花みなせ","伊ヶ崎綾香"];
const rainbow = ["#ff2d55","#ff9500","#30b0c7","#5856d6","#af52de"];
const vas = kind => `
  <div><div class="sec">常听声优</div>
  <div class="vas">${names.map((n, i) => `<div class="va"><div class="mono m-${kind}" ${kind === "rain" ? `style="background:linear-gradient(${rainbow[i]}cc,${rainbow[i]})"` : ""}>${n[0]}</div>${n}</div>`).join("")}</div></div>`;

const nav = badge => `
  <div class="nav"><span><i class="ti ti-arrow-down"></i></span><span style="--badge:${badge}"><i class="ti ti-settings"></i><b class="dot">3</b></span></div>
  <div class="title">Tonari</div>`;

const hero = sealPlay => `
  <div class="hero"><div class="cover c1"></div><div class="shade"></div>
    <div class="txt"><small>继续收听</small><b>【バイノーラル】となりの先輩と過ごす放課後</b><em>第 3 首 · 剩 18 分钟</em></div>
    <span class="play ${sealPlay ? "seal" : ""}"><i class="ti ti-player-play-filled"></i>播放</span></div>`;

const sleep = sealOn => `
  <div><div class="sec" style="padding-bottom:10px">睡眠定时</div>
  <div class="chips"><span class="chip">15 分钟</span><span class="chip on ${sealOn ? "seal" : ""}"><i class="ti ti-moon-filled" style="font-size:12px"></i>30 分钟</span><span class="chip">1 小时</span><span class="chip">播完本曲</span></div></div>`;

const picks = seal => `<div class="picks ${seal ? "seal" : ""}"><div><i class="ti ti-arrows-shuffle"></i>随机一部</div><div><i class="ti ti-tag"></i>按标签挑</div></div>`;

const now = `
  <div class="now">
    <div class="top"><div class="cover c1"></div><div class="meta2"><small>继续收听 · 第 3 首</small><b>【バイノーラル】となりの先輩と過ごす放課後</b></div></div>
    <div class="prog"><div></div></div>
    <div class="ctl"><span class="t">剩 18 分钟</span><span class="play seal"><i class="ti ti-player-play-filled"></i>播放</span></div>
    <div class="sl"><i class="ti ti-moon"></i><span class="chip">15 分</span><span class="chip on seal">30 分</span><span class="chip">1 小时</span><span class="chip">播完本曲</span></div>
  </div>`;

const schemes = [
  {key:"A", name:"只换声优头像", tag:"最小改动",
   desc:"布局和其余元素完全不动，只把彩色圆形换成 iOS 通讯录那种灰色渐变头像。主页整体回到纯单色，朱红只留在设置印章和未读角标。",
   impl:"改动：<code>Monogram</code> 的八色色板换成一组灰色渐变，约 5 行。",
   seal:false, va:"gray", badge:"#ff3b30"},
  {key:"B", name:"朱红点缀关键操作", tag:"推荐",
   desc:"布局不动，朱红只出现在「此刻会发生什么」的地方：继续收听的播放钮、正在跑的睡眠定时、随机/按标签的图标。声优头像改成小号印章——方形朱印配宋体字，和 App 图标、设置头卡是同一套语言。",
   impl:"改动：<code>Color.seal</code> 提到共享位置；播放钮、睡眠定时激活态、两个挑选按钮图标换色；<code>Monogram</code> 改为印章样式。都在 HomeView 一个文件内。",
   seal:true, va:"seal", badge:"#ff3b30"},
  {key:"C", name:"收听面板 + 朱红点缀", tag:"改动最大",
   desc:"在 B 的基础上，把大封面卡换成一块收听面板：小封面、标题、朱红进度条、播放钮，睡眠定时收进面板底部——定时本来就是给正在听的东西用的。首屏能多露出一排「最近播放」。缺点是失去了大封面的氛围感。",
   impl:"改动：B 的全部 + 重写 <code>ResumeCard</code>，独立的睡眠定时区块并入面板；视频续播卡同样改造。",
   seal:true, va:"seal", badge:"#ff3b30", panel:true},
];

const screen = s => s.panel
  ? `${nav(s.badge)}<div class="stack">${now}${picks(true)}${recent}${vas(s.va)}</div>`
  : `${nav(s.badge)}<div class="stack">${hero(s.seal)}${sleep(s.seal)}${picks(s.seal)}${recent}${vas(s.va)}</div>`;

document.getElementById("schemes").innerHTML =
  `<div class="card"><div class="head"><h2>现状</h2><span class="tag">参照</span></div>
   <p class="desc">按当前 HomeView 画的，用来对比。</p>
   <div class="pair"><div class="phone light">${nav("#ff3b30")}<div class="stack">${hero(false)}${sleep(false)}${picks(false)}${recent}${vas("rain")}</div></div>
   <div class="phone dark">${nav("#ff3b30")}<div class="stack">${hero(false)}${sleep(false)}${picks(false)}${recent}${vas("rain")}</div></div></div></div>` +
  schemes.map(s => `<div class="card">
    <div class="head"><h2>${s.key}. ${s.name}</h2><span class="tag">${s.tag}</span></div>
    <p class="desc">${s.desc}</p><p class="impl">${s.impl}</p>
    <div class="pair"><div class="phone light">${screen(s)}</div><div class="phone dark">${screen(s)}</div></div>
  </div>`).join("");
</script>
</body>
</html>
