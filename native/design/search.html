<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索页</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f5f5f4;--surface-1:#ebebea;--surface-2:#fff;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.18);
--text-primary:#1a1a19;--text-secondary:#5f5e5a;--text-muted:#888780;--text-accent:#185fa5;--text-danger:#a32d2d;--text-warning:#854f0b;--text-success:#3b6d11;--text-pro:#534ab7;
--bg-accent:#e6f1fb;--bg-danger:#fcebeb;--bg-warning:#faeeda;--bg-success:#eaf3de;--bg-pro:#eeedfe}
@media (prefers-color-scheme:dark){:root{--surface-0:#161615;--surface-1:#232322;--surface-2:#2c2c2a;--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.2);
--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;--text-accent:#85b7eb;--text-danger:#f09595;--text-warning:#ef9f27;--text-success:#97c459;--text-pro:#afa9ec;
--bg-accent:#0c447c;--bg-danger:#501313;--bg-warning:#412402;--bg-success:#173404;--bg-pro:#26215c}}
body{margin:0;padding:24px;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
.meta{font-size:13px;color:var(--text-secondary);margin:0 0 16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body><main>
<h1>搜索页</h1>
<p class="meta">2026-09-25 确认 · 见 PLAN.md 第 6 节「搜索页」。三种状态各只显示一样东西。</p>
<style>
.ph{background:var(--surface-1);border-radius:16px;padding:12px 14px;min-width:0}
.k{font-size:12px;color:var(--text-secondary)}
.field{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:99px;padding:6px 10px;font-size:12px;color:var(--text-muted)}
.seg{display:flex;background:var(--surface-2);border:0.5px solid var(--border);border-radius:99px;padding:2px;font-size:11px;margin:8px 0}
.seg span{flex:1;text-align:center;padding:3px 0;border-radius:99px;color:var(--text-secondary)}
.seg .on{background:var(--surface-1);color:var(--text-primary)}
.h{font-size:13px;font-weight:500;margin:10px 0 4px;display:flex;justify-content:space-between}
.row{display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:0.5px solid var(--border)}
.av{width:24px;height:24px;border-radius:50%;background:var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary)}
.sq{width:30px;height:23px;border-radius:5px;background:var(--border-strong);flex:none}
.lbl{font-size:13px;font-weight:500;margin:8px 0 2px;text-align:center}
.sub{font-size:11px;color:var(--text-secondary);text-align:center;margin:0}
</style>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
  <div><div class="ph">
      <p style="font-size:17px;font-weight:500;margin:2px 0 8px">搜索</p>
      <div class="field"><i class="ti ti-search"></i>作品、声优、社团、#标签</div>
      <p class="h"><span>分类浏览</span><span style="color:var(--text-accent);font-weight:400;font-size:12px">按名称</span></p>
      <div class="seg"><span class="on">社团</span><span>声优</span><span>标签</span></div>
      <div class="row"><span class="av"><i class="ti ti-building"></i></span><span style="flex:1">マヨタマ</span><span class="k">26</span></div>
      <div class="row" style="border-bottom:none"><span class="av"><i class="ti ti-building"></i></span><span style="flex:1">しゃーぷ</span><span class="k">17</span></div>
    </div><p class="lbl">① 未点搜索框</p><p class="sub">只有分类浏览</p></div>
  <div><div class="ph">
      <div style="display:flex;gap:6px;align-items:center"><div class="field" style="flex:1"><i class="ti ti-search"></i><span style="border-left:1.5px solid var(--text-accent);height:13px"></span></div><span class="k"><i class="ti ti-x"></i></span></div>
      <p class="h"><span>最近搜索</span><span style="color:var(--text-accent);font-weight:400;font-size:12px">清除</span></p>
      <div class="row"><span class="av"><i class="ti ti-user"></i></span><span style="flex:1">柚木つばめ<br><span class="k">声优</span></span></div>
      <div class="row"><span class="sq"></span><span style="flex:1">被低音高冷暗黑骑士…<br><span class="k">作品</span></span></div>
      <div class="row" style="border-bottom:none"><span class="av"><i class="ti ti-search"></i></span><span style="flex:1">耳かき</span></div>
    </div><p class="lbl">② 点了搜索框、未输入</p><p class="sub">只有最近搜索，无切换条</p></div>
  <div><div class="ph">
      <div style="display:flex;gap:6px;align-items:center"><div class="field" style="flex:1;color:var(--text-primary)"><i class="ti ti-search"></i>つばめ</div><span class="k"><i class="ti ti-x"></i></span></div>
      <div class="seg"><span class="on">全部</span><span>作品</span><span>声优</span><span>社团</span><span>标签</span></div>
      <p class="h"><span>作品</span></p>
      <div class="row"><span class="sq"></span><span style="flex:1">耳かき専門店<br><span class="k">柚木つばめ</span></span></div>
      <p class="h"><span>声优</span></p>
      <div class="row" style="border-bottom:none"><span class="av"><i class="ti ti-user"></i></span><span style="flex:1">柚木つばめ<br><span class="k">9 部作品</span></span></div>
    </div><p class="lbl">③ 输入之后</p><p class="sub">这时才出现范围切换</p></div>
</div>
</main></body></html>
